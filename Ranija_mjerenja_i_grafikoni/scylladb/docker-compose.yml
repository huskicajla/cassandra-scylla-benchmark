services:

  scylla-node1:
    image: scylladb/scylla:2026.2.2
    container_name: scylla-node1
    hostname: scylla-node1

    command:
      - "--smp"
      - "2"
      - "--memory"
      - "4G"
      - "--seeds"
      - "scylla-node1"
      - "--overprovisioned"
      - "1"

    mem_limit: 6g
    cpus: 2.0

    ports:
      - "9042:9042"

    volumes:
      - scylla-node1-data:/var/lib/scylla

    networks:
      scylla-net:
        ipv4_address: 172.20.0.2


  scylla-node2:
    image: scylladb/scylla:2026.2.2
    container_name: scylla-node2
    hostname: scylla-node2

    command:
      - "--smp"
      - "2"
      - "--memory"
      - "4G"
      - "--seeds"
      - "scylla-node1"
      - "--overprovisioned"
      - "1"

    mem_limit: 6g
    cpus: 2.0

    volumes:
      - scylla-node2-data:/var/lib/scylla

    networks:
      scylla-net:
        ipv4_address: 172.20.0.3

    ports:
      - "9043:9042"

    depends_on:
      - scylla-node1


  scylla-node3:
    image: scylladb/scylla:2026.2.2
    container_name: scylla-node3
    hostname: scylla-node3

    command:
      - "--smp"
      - "2"
      - "--memory"
      - "4G"
      - "--seeds"
      - "scylla-node1"
      - "--overprovisioned"
      - "1"

    mem_limit: 6g
    cpus: 2.0

    volumes:
      - scylla-node3-data:/var/lib/scylla

    networks:
      scylla-net:
        ipv4_address: 172.20.0.4

    ports:
      - "9044:9042"

    depends_on:
      - scylla-node1


networks:
  scylla-net:
    name: scylla-benchmark-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24


volumes:
  scylla-node1-data:
  scylla-node2-data:
  scylla-node3-data:
