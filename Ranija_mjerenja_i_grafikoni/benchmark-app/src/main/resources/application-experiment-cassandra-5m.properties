spring.main.web-application-type=none
benchmark.execute-on-startup=true
benchmark.database.type=cassandra
benchmark.database.host=localhost
benchmark.database.port=9042
benchmark.database.keyspace=benchmark
benchmark.database.local-datacenter=datacenter1
benchmark.database.consistency-level=LOCAL_QUORUM
benchmark.database.replication-factor=3
benchmark.dataset.path=../../data-generator/output/telemetry-50m
benchmark.dataset.size=5000000
benchmark.read-dataset-size=5000000
benchmark.sequential-write-size=20000
benchmark.concurrent-write-size=1000000
benchmark.read-operation-count=100000
benchmark.mixed-operation-count=100000
benchmark.warmup-runs=1
benchmark.measurement-runs=3
benchmark.concurrency=32
benchmark.sustained-duration-seconds=600
benchmark.sustained-target-ops-per-second=2000
benchmark.progress-report-seconds=30
benchmark.abort-on-operation-failure=true
benchmark.test-series=FINAL_5M_CASSANDRA_OPTIMIZED_V2
