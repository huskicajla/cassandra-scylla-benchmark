spring.application.name=benchmark-app
spring.main.web-application-type=none
benchmark.execute-on-startup=false
benchmark.database.type=cassandra
benchmark.database.host=localhost
benchmark.database.port=9042
benchmark.database.keyspace=benchmark
benchmark.database.local-datacenter=datacenter1
benchmark.database.consistency-level=LOCAL_QUORUM
benchmark.database.replication-factor=3
benchmark.dataset.path=../../data-generator/output/telemetry-50m
benchmark.dataset.size=10000
benchmark.warmup-runs=1
benchmark.measurement-runs=3
benchmark.concurrency=32
benchmark.sequential-write-size=10000
benchmark.concurrent-write-size=10000
benchmark.read-dataset-size=10000
benchmark.read-operation-count=10000
benchmark.mixed-operation-count=10000
benchmark.progress-report-seconds=30
benchmark.abort-on-operation-failure=false
benchmark.sustained-duration-seconds=10
benchmark.sustained-target-ops-per-second=1000
