services:
  cassandra-scale2-node1:
    image: cassandra:5.0.8
    container_name: cassandra-scale2-node1
    hostname: cassandra-scale2-node1
    environment:
      CASSANDRA_CLUSTER_NAME: cassandra-scale2
      CASSANDRA_SEEDS: cassandra-scale2-node1
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_NUM_TOKENS: 16
      MAX_HEAP_SIZE: 2G
    ports:
      - "9042:9042"
    mem_limit: 6g
    cpus: 2.0
    volumes:
      - cassandra-scale2-node1-data:/var/lib/cassandra
    networks:
      cassandra-scale2-net:
        ipv4_address: 172.24.0.2

  cassandra-scale2-node2:
    image: cassandra:5.0.8
    container_name: cassandra-scale2-node2
    hostname: cassandra-scale2-node2
    environment:
      CASSANDRA_CLUSTER_NAME: cassandra-scale2
      CASSANDRA_SEEDS: cassandra-scale2-node1
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_NUM_TOKENS: 16
      MAX_HEAP_SIZE: 2G
    ports:
      - "9043:9042"
    mem_limit: 6g
    cpus: 2.0
    volumes:
      - cassandra-scale2-node2-data:/var/lib/cassandra
    networks:
      cassandra-scale2-net:
        ipv4_address: 172.24.0.3
    depends_on:
      - cassandra-scale2-node1

networks:
  cassandra-scale2-net:
    name: cassandra-scale2-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.24.0.0/24

volumes:
  cassandra-scale2-node1-data:
  cassandra-scale2-node2-data:
